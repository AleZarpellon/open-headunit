name: Release APK

# A push to a working branch only builds and verifies the signed APK.
# A tag such as v1.0 also publishes it as a Release, with notes from note-release/<tag>.md.
on:
  push:
    branches: [riconnessione-stabile]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed github release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # Retried because sdkmanager downloads occasionally arrive corrupt on hosted runners.
      - name: Install pinned NDK, CMake and build tools
        run: |
          for attempt in 1 2 3; do
            sdkmanager "ndk;29.0.14206865" "cmake;3.22.1" "build-tools;36.0.0" && exit 0
            echo "sdkmanager attempt $attempt failed; retrying in 15s..." >&2
            sleep 15
          done
          echo "sdkmanager failed after 3 attempts" >&2
          exit 1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # app/build.gradle.kts signs the release only when this file exists at the repository root.
      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.HEADUNIT_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Secret HEADUNIT_KEYSTORE_BASE64 is missing" >&2; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > headunit-release-key.jks

      - name: Assemble github release APK
        env:
          HEADUNIT_KEYSTORE_PASSWORD: ${{ secrets.HEADUNIT_KEYSTORE_PASSWORD }}
          HEADUNIT_KEY_PASSWORD: ${{ secrets.HEADUNIT_KEY_PASSWORD }}
        run: ./gradlew :app:assembleGithubRelease --stacktrace

      - name: Verify the APK is signed and carries the fork's identity
        id: apk
        run: |
          apk=$(ls app/build/outputs/apk/github/release/*.apk)
          test "$(echo "$apk" | wc -l)" = 1 || { echo "Expected one APK, found: $apk" >&2; exit 1; }
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify --verbose --print-certs "$apk"
          badging=$("$tools/aapt2" dump badging "$apk")
          echo "$badging" | grep -E "^(package|application-label):"
          echo "$badging" | grep -q "^package: name='io.github.alezarpellon.headunitcustom'" \
            || { echo "Unexpected application id" >&2; exit 1; }
          echo "$badging" | grep -q "^application-label:'HeadUnit Revived Custom'" \
            || { echo "Unexpected application label" >&2; exit 1; }
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: headunit-custom-release
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          APK: ${{ steps.apk.outputs.path }}
        run: |
          case "$APK" in
            *"_${TAG#v}.apk") ;;
            *) echo "Tag $TAG does not match versionName in $APK" >&2; exit 1 ;;
          esac
          test -f "note-release/$TAG.md" || { echo "Missing note-release/$TAG.md" >&2; exit 1; }
          gh release create "$TAG" "$APK" \
            --repo "$GITHUB_REPOSITORY" \
            --title "HeadUnit Revived Custom $TAG" \
            --notes-file "note-release/$TAG.md" \
            --latest

      - name: Remove signing key
        if: always()
        run: rm -f headunit-release-key.jks
